[package]
name = "nebudcs-scripting"
version = "0.1.0"
edition = "2021"
authors = ["NebuDCS Architecture Team"]
description = "Custom equipment authoring, declarative curves, package composition, and sandboxed Rhai scripting for NebuDCS."

[dependencies]
nebudcs-types     = { path = "../nebudcs-types" }
nebudcs-units     = { path = "../nebudcs-units" }
nebudcs-model     = { path = "../nebudcs-model" }
nebudcs-sim       = { path = "../nebudcs-sim" }
nebudcs-physics   = { path = "../nebudcs-physics" }
nebudcs-control   = { path = "../nebudcs-control" }
nebudcs-alarm     = { path = "../nebudcs-alarm" }
nebudcs-topology  = { path = "../nebudcs-topology" }
rhai              = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
toml              = { workspace = true }
thiserror         = { workspace = true }
indexmap          = { workspace = true }
ulid              = { workspace = true }
