[package]
name = "nebudcs-control"
version = "0.1.0"
edition = "2021"
authors = ["NebuDCS Architecture Team"]
description = "Control engine, PID algorithms, actuator arbitration, protection, and automation primitives for NebuDCS."

[dependencies]
nebudcs-types  = { path = "../nebudcs-types" }
nebudcs-units  = { path = "../nebudcs-units" }
nebudcs-model  = { path = "../nebudcs-model" }
nebudcs-sim    = { path = "../nebudcs-sim" }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
ulid           = { workspace = true }

[dev-dependencies]
nebudcs-physics = { path = "../nebudcs-physics" }
