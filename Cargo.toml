[workspace]
resolver = "2"
members = [
    "crates/nebudcs-types",
    "crates/nebudcs-units",
    "crates/nebudcs-model",
    "crates/nebudcs-topology",
    "crates/nebudcs-sim",
    "crates/nebudcs-physics",
]

# Workspace-level dependency versions pinned here.
# All member crates reference these via `{ workspace = true }` to keep
# versions consistent across the repository.
[workspace.dependencies]
# Serialization — approved by ADR-006 and project-format.md
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml       = "0.8"
# Error handling — approved by ADR-001
thiserror  = "2.0"
# Unique identifier generation (ULID — sortable, compact Base32)
ulid       = { version = "1.1", features = ["serde"] }
# Ordered map preserving insertion order — used in EquipmentDefinition parameters
indexmap   = { version = "2.7", features = ["serde"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.test]
opt-level = 1
